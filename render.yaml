services:
  - type: web
    name: doctor-tracker-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_DAYS
        value: 7
      - key: CLIENT_ORIGIN
        sync: false
      - key: STATS_TIMEZONE
        value: UTC
